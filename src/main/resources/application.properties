spring.application.name=chatterbox
server.port=8081

## DataSource properties
spring.datasource.url=jdbc:postgresql://localhost:5090/chatterboxDB
spring.datasource.username=chatterbox
spring.datasource.password=myb@byga1Jamy
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway properties
spring.flyway.locations=classpath:db/migration
spring.flyway.fail-on-missing-locations=true
spring.flyway.default-schema=chatterbox
spring.flyway.schemas=chatterbox
spring.flyway.create-schemas=true
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true